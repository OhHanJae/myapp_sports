name: Android debug builds
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Ubuntu GitHub runners include command-line Android SDK tools.
      # setup-android@v3 tries to install retired 'tools' package on newer SDK indexes.
      # Existing custom Gradle wrapper bytecode targets Java 21; keep JDK 17 for Kotlin toolchain.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android 36 SDK
        run: |
          SDKMANAGER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)
          test -n "$SDKMANAGER" || { echo 'Android sdkmanager not installed'; exit 1; }
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'
      - run: chmod +x ./gradlew && ./gradlew :core:smokeTest :phone:assembleDebug :wear:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: matchday-debug-apks
          path: |
            phone/build/outputs/apk/debug/*.apk
            wear/build/outputs/apk/debug/*.apk
