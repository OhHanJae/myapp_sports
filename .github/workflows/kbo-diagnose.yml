name: KBO upstream probe
on:
  pull_request:
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe public KBO postseason endpoint and deployed Worker health
        run: node tools/diagnose-kbo-upstream.mjs
